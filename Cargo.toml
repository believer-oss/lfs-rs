[package]
name = "lfs-rs"
version = "0.3.8"
authors = [
  "Jason White <rust@jasonwhite.io>",
  "The Believer Company <believeross@believer.gg>",
]
edition = "2024"
description = """
A high-performance, caching Git LFS server with an AWS S3 back-end.
"""
documentation = "https://github.com/believer-oss/lfs-rs"
homepage = "https://github.com/believer-oss/lfs-rs"
repository = "https://github.com/believer-oss/lfs-rs"
readme = "README.md"
keywords = ["git-lfs", "s3"]
categories = ["command-line-utilities"]
license = "MIT"

[dependencies]
askama = "0.16.1"
async-stream = "0.3.6"
async-trait = "0.1.92"
aws-config = { version = "1.12" }
# The defaults, less `rustls`, which builds the legacy hyper 0.14 client stack
# alongside the hyper 1.x one that BehaviorVersion v2026_01_12 selects. See
# https://github.com/awslabs/aws-sdk-rust/discussions/1257
aws-sdk-dynamodb = { version = "1.127", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
], optional = true }
aws-sdk-s3 = { version = "1.149", default-features = false, features = [
  "default-https-client",
  "http-1x",
  "rt-tokio",
  "sigv4a",
] }
aws-smithy-types = { version = "1.8" }
bytes = "1.12"
chacha20 = { version = "0.10.2", features = ["xchacha"] }
chrono = "0.4.45"
derive_more = { version = "2.1", features = ["display", "from"] }
futures = "0.3.34"
hex = "0.4.3"
http = "1.5"
http-body-util = "0.1.5"
human-size = "0.4.4"
humansize = "2.1"
humantime = "2.4"
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
# For the GitHub API. rustls with aws-lc, as the AWS SDK and OTLP use, so no
# OpenSSL is built.
hyper-rustls = "0.27.10"
rustls = { version = "0.23.45", default-features = false, features = [
  "aws_lc_rs",
] }
tower = { version = "0.5.3", features = ["util"] }
linked-hash-map = { version = "0.5.6", features = ["serde_impl"] }
rand = { version = "0.10.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
clap = { version = "4.6", features = ["derive", "env"] }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["full"] }
url = "2.5"
uuid = { version = "1.26", features = ["v4"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
redis = { version = "0.28", optional = true, features = ["aio", "tokio-comp"] }
base64 = { version = "0.23.1" }
parking_lot = { version = "0.12.5" }

opentelemetry = { version = "0.33.0", optional = true }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = [
  "internal-logs",
  "metrics",
  "trace",
], optional = true }
# OTLP over gRPC only. TLS uses aws-lc, as the AWS SDK does, so ring is not
# built.
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
  "grpc-tonic",
  "metrics",
  "tls-aws-lc",
  "tls-roots",
  "trace",
], optional = true }
opentelemetry-semantic-conventions = { version = "0.33.0", optional = true }
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-opentelemetry = { version = "0.34.0", optional = true }
tracing-log = { version = "0.2" }
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "json",
  "registry",
] }

[dev-dependencies]
rand = "0.10.3"
tempfile = "3.27"
duct = "1.1.2"
wiremock = "0.6.5"

[features]
default = ["dynamodb", "otel"]
# If the "faulty" feature is enabled, random failures are injected into the byte
# stream.
faulty = ["rand"]
redis = ["dep:redis"]
dynamodb = ["dep:aws-sdk-dynamodb"]
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry-semantic-conventions",
  "dep:tracing-opentelemetry",
]
