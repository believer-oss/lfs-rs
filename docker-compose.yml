# Copy this file to another location and modify as necessary.
services:
  app:
    # Built from this repository. To use a published image instead, replace
    # this with `image: ghcr.io/believer-oss/lfs-rs:<commit>`.
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - data:/data
    restart: always
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_DEFAULT_REGION
      # Passed through only if set, in `.env` or the environment. Leave
      # RUDOLFS_KEY unset to store objects unencrypted.
      - RUDOLFS_KEY
      - RUDOLFS_MAX_CACHE_SIZE
      - RUDOLFS_S3_BUCKET
    command:
      - --cache-dir
      - /data
      - s3

  # A real production server should use nginx. How to configure this depends on
  # your needs. Use your Google-search skills to configure this correctly.
  #
  # nginx:
  #   image: nginx:stable
  #   ports:
  #     - 80:80
  #     - 443:443
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #     - ./nginx/errors.log:/etc/nginx/errors.log


volumes:
  data:
