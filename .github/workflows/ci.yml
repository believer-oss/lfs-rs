name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      - name: Run cargo check
        run: cargo check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The S3, DynamoDB and Redis tests run against rustfs, DynamoDB Local and
    # Redis. They skip when unconfigured, so LFS_TEST_REQUIRED makes a skip fail here instead of
    # passing silently. See tests/common.rs for the variables.
    env:
      LFS_TEST_REQUIRED: "1"
      LFS_TEST_S3_ENDPOINT: http://localhost:9000
      LFS_TEST_S3_BUCKET: lfs-rs-scratch-ci
      LFS_TEST_DYNAMODB_ENDPOINT: http://localhost:8000
      LFS_TEST_DYNAMODB_TABLE: ci
      LFS_TEST_REDIS_URI: redis://localhost:6379
      LFS_TEST_AWS_ACCESS_KEY_ID: lfstest
      LFS_TEST_AWS_SECRET_ACCESS_KEY: lfstestsecret

    steps:
      # Started first so they boot while the toolchain installs, and as steps
      # rather than `services:` because rustfs needs `server /data` as its
      # command. Keep the images in sync with tests/docker-compose.yaml.
      #
      # rustfs rather than minio, which has withdrawn its community image.
      # `latest` is a rolling build, hence the digest; the `1.0.0-alpha.N`
      # release images lack the entrypoint that provisions /data, so
      # `server /data` fails on them.
      - name: Start rustfs, DynamoDB Local and Redis
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY="$LFS_TEST_AWS_ACCESS_KEY_ID" \
            -e RUSTFS_SECRET_KEY="$LFS_TEST_AWS_SECRET_ACCESS_KEY" \
            rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff \
            server /data
          docker run -d --name dynamodb -p 8000:8000 \
            amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab \
            -jar DynamoDBLocal.jar -sharedDb -inMemory
          docker run -d --name redis -p 6379:6379 \
            redis@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f

      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      # The tests create the bucket and tables themselves. DynamoDB Local
      # answers `GET /` with a 400 once it is listening.
      - name: Wait for the services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/health > /dev/null \
              && curl -s -o /dev/null http://localhost:8000/ \
              && docker exec redis redis-cli ping > /dev/null \
              && exit 0
            sleep 2
          done
          echo "::error::the test services did not become ready"
          docker logs rustfs
          docker logs dynamodb
          docker logs redis
          exit 1

      # Every feature except `faulty`, which injects stream errors that the
      # S3 round trips can't survive. Clippy still builds it.
      - name: Run cargo test
        run: cargo test --features redis

      - name: Service logs
        if: failure()
        run: |
          docker logs rustfs
          docker logs dynamodb
          docker logs redis

  formatting:
    name: Check format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1
        with:
          components: rustfmt, clippy
          toolchain: nightly

      - name: Check format and linting
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-features
