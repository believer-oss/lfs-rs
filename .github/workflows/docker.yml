name: docker

on:
  workflow_dispatch:

env:
  IMAGE_NAME: lfs-rs

jobs:
  docker:
    name: Docker Build and Push
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      # Each platform builds natively, so arm64 builds under qemu emulation. This
      # registers qemu the way docker/setup-qemu-action does, without adding a
      # third-party action.
      - name: Set up emulation and buildx
        run: |
          docker run --privileged --rm \
            tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 \
            --install arm64
          docker buildx create --use --driver docker-container

      - name: Build, tag, and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/believer-oss/$IMAGE_NAME:$IMAGE_TAG \
            --push \
            .
